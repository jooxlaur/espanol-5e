<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Español 5e">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Español 5e</title>
<style>
:root{
  --bg:#F6F4F0; --card:#FFFFFF; --ink:#1E2328; --ink2:#59626D; --ink3:#868D96;
  --line:#E6E1D9; --line2:#D3CCC1; --brand:#22303C; --brand-soft:#EDF0F3;
  --v:#C2410C; --vbg:#FFF2EA; --q:#7E22CE; --p:#0369A1; --pbg:#E8F3FA; --o:#868D96;
  --ok:#15803D; --okbg:#EAF6EE; --ko:#B45309; --kobg:#FFF6E3; --mark:#FCE38A;
  --r:18px; --r2:14px;
  --sh:0 1px 2px rgba(30,35,40,.05),0 6px 18px rgba(30,35,40,.05);
  --fs:18px;
  --sb:env(safe-area-inset-bottom,0px);
}
body.grande{--fs:21px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs)/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
.app{max-width:900px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 20px calc(48px + var(--sb))}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.muted{color:var(--ink2)}
.pic{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1;display:inline-grid;place-items:center}
.pic svg{width:1em;height:1em}
.sw{width:1em;height:1em;border-radius:.22em;border:1px solid rgba(0,0,0,.16);display:block}

/* barre du haut */
.bar{display:flex;align-items:center;gap:12px;min-height:60px;margin-bottom:6px}
.bar h1{font-size:1.15rem;font-weight:700;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);flex:none}

/* accueil */
.brand{display:flex;align-items:center;gap:14px;margin:8px 0 18px}
.logo{width:54px;height:54px;border-radius:16px;background:var(--v);color:#fff;font-weight:800;display:grid;place-items:center;font-size:1.3rem;letter-spacing:-.02em;flex:none}
.brand-t{font-weight:800;font-size:1.4rem;line-height:1.2}
.brand-s{color:var(--ink2);font-size:.92rem}
.brand .ib{margin-left:auto}
.fecha-card{display:flex;align-items:center;gap:16px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px;box-shadow:var(--sh);margin-bottom:16px}
.fecha-card .ic{width:52px;height:52px;border-radius:14px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.lab{display:block;font-size:.78rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.fecha-txt{display:block;font-size:clamp(20px,3.4vw,28px);font-weight:700;line-height:1.25;margin:2px 0}
.fecha-fr{display:block;color:var(--ink2);font-size:.95rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-height:clamp(158px,22vh,230px);box-shadow:var(--sh);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.tile .ti{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);margin-bottom:6px}
.tile .ti svg{width:28px;height:28px}
.tile b{font-size:1.25rem;line-height:1.2}
.tile small{color:var(--ink2);font-size:.92rem;line-height:1.35}
.tile .badge{margin-top:auto;font-size:.85rem;font-weight:700;color:var(--ok);background:var(--okbg);border-radius:999px;padding:3px 10px}
.resume{display:flex;align-items:center;gap:10px;width:100%;margin-top:14px;padding:14px 18px;border-radius:var(--r2);border:1px dashed var(--line2);color:var(--ink2)}
.resume b{color:var(--ink)}
.resume svg{margin-left:auto}

/* listes */
.grp{margin-top:18px}
.grp-t{font-size:1rem;font-weight:750;margin:0 4px 10px}
.grp-t span{display:block;font-weight:400;color:var(--ink2);font-size:.88rem}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px;min-height:68px}
.row-ic{font-size:30px;width:46px;height:46px;flex:none}
.row-tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row-tx b{font-weight:650;line-height:1.3}
.row-tx small{color:var(--ink2);font-size:.88rem;line-height:1.3}
.row>svg{color:var(--ink3)}
.pbar{height:6px;border-radius:6px;background:var(--line);margin-top:8px;overflow:hidden;max-width:240px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.lock{font-size:.75rem;font-weight:700;color:var(--ink2);background:var(--brand-soft);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px}

/* phrases en couleurs */
.s{line-height:2}
.s .ch{white-space:nowrap}
.w{display:inline-block;line-height:1.25;border-radius:6px}
.w.v{color:var(--v);box-shadow:inset 0 0 0 2px var(--v);background:var(--vbg);padding:.02em .22em;border-radius:6px;font-weight:600}
.w.q{color:var(--q);font-weight:700;text-decoration:underline;text-decoration-color:var(--q);text-decoration-thickness:.11em;text-underline-offset:.2em}
.w.p{color:var(--p);box-shadow:inset 0 0 0 2px var(--p);background:var(--pbg);padding:.02em .34em;border-radius:999px;font-weight:600}
.w.o{color:var(--o)}
/* couleurs douces (par défaut) : le texte reste foncé, seuls les cadres sont colorés */
.c-douces .w.v{color:var(--ink);box-shadow:inset 0 0 0 2px #CF7A3E;background:#FFF8F2;font-weight:500}
.c-douces .w.q{color:var(--ink);font-weight:600;text-decoration-color:#9B6BD3;text-decoration-thickness:.09em}
.c-douces .w.p{color:var(--ink);box-shadow:inset 0 0 0 2px #4E93C4;background:#F3F9FD;font-weight:500}
.c-sans .w.v,.c-sans .w.q,.c-sans .w.p{color:inherit;box-shadow:none;background:none;text-decoration:none;font-weight:inherit;padding:0}
.w mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 .03em}
.w.hl{background:var(--mark)!important}
/* « Cases » : les cadres sans les mots */
.w.hid{color:transparent!important;cursor:pointer}
.w.hid mark{background:none}
.w.n.hid,.c-sans .w.hid{outline:2px dashed var(--line2);outline-offset:-2px;border-radius:6px}
/* « Mot à mot » : le sens de chaque mot dessous */
.mw{display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline}
.mw>small{font-size:max(13px,.4em);font-weight:500;color:var(--ink2);line-height:1.2;margin-top:.15em;white-space:nowrap;letter-spacing:0}
.vues{display:flex;width:max-content;max-width:100%;margin:0 auto 6px}
.fr1{color:var(--ink)}
.w.sel{outline:3px solid var(--ink);outline-offset:3px}
.blank{display:inline-block;width:3.4em;height:.95em;border-bottom:3px solid var(--ink);vertical-align:-.05em}
[data-act="tok"]{cursor:pointer}

/* page de leçon */
.lh{display:flex;gap:16px;align-items:center;margin:2px 0 14px}
.lh .pic{font-size:46px;width:64px;height:64px;background:var(--card);border:1px solid var(--line);border-radius:18px;flex:none}
.lh h2{margin:0;font-size:clamp(22px,3.6vw,30px);line-height:1.2}
.lh p{margin:2px 0 0;color:var(--ink2)}
.intro{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:var(--r2);padding:12px 16px;margin:0 0 14px;color:var(--ink2)}
.intro b{color:var(--ink)}
.sec-t{font-size:.78rem;font-weight:750;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);margin:26px 4px 10px}
.srow{display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px 16px}
.srow .s{font-size:1.2rem}
.srow small{display:block;color:var(--ink2);font-size:.9rem;line-height:1.35}
.srow .ans{display:flex;gap:8px;margin-top:4px}
.srow .ans::before{content:"↳";color:var(--ink3);font-size:1.2rem;line-height:2}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:122px}
.wcard .pic{font-size:40px;min-height:44px}
.wcard b{font-size:1.05rem;font-weight:650;line-height:1.25}
.wcard small{color:var(--ink2);font-size:.85rem;line-height:1.3}
.wgrid.compact{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}
.wgrid.compact .wcard{min-height:0;padding:10px 8px}
.dcard{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px}
.dcard .ic{width:46px;height:46px;border-radius:13px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.dcard b{display:block}
.dcard small{color:var(--ink2)}
.dcard>svg:last-child{margin-left:auto;color:var(--ink3)}
.stack{display:flex;flex-direction:column;gap:10px}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 22px;border-radius:15px;background:var(--brand);color:#fff;font-weight:650;border:1px solid var(--brand);text-align:center}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2)}
.btn.wide{width:100%}
.btn.sm{min-height:44px;padding:0 16px;border-radius:12px;font-size:.95rem;white-space:nowrap}
.btn:disabled{opacity:.4}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row .btn{flex:1}
.link{color:var(--brand);font-weight:650;text-decoration:underline;text-underline-offset:3px}
.danger{color:#B42318}

/* vue « grand écran » */
.fx{min-height:calc(100vh - 230px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:18px;padding:6px 0 130px}
.big{font-size:clamp(30px,5.8vw,52px);font-weight:600;line-height:1.3;max-width:100%}
.big .s{line-height:1.75}
.pic.xl{font-size:clamp(84px,14vw,130px)}
.fr{color:var(--ink2);font-size:clamp(18px,2.8vw,26px);line-height:1.35}
.frbox{min-height:1.5em}
.note{background:#FFFBEA;border:1px solid #EFE0A0;border-radius:12px;padding:10px 14px;font-size:.95rem;color:#5A4A10;max-width:660px;text-align:left}
.gloss{min-height:62px;max-width:640px;width:100%;display:flex;align-items:center;justify-content:center}
.gloss>div{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:10px 18px;box-shadow:var(--sh);font-size:1.1rem}
.gloss small{display:block;color:var(--ink2);font-size:.9rem}
.gloss .tip{color:var(--ink3);font-size:.95rem}
.legend{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;font-size:.86rem;color:var(--ink2);align-items:center}
.legend .w{font-size:.95rem}
.fbar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + var(--sb));background:rgba(246,244,240,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;align-items:center;gap:12px;z-index:20}
.fbar button{width:66px;height:56px;border-radius:16px;background:var(--card);border:1px solid var(--line2);display:grid;place-items:center;font-weight:800;font-size:1rem}
.fbar button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.fbar button:disabled{opacity:.3}
.fbar .btn{width:auto;flex:1;max-width:520px;height:56px;font-size:1.05rem;background:var(--brand);color:#fff;border-color:var(--brand)}
.fbar .btn.ghost{background:var(--card);color:var(--ink);border-color:var(--line2)}
.fbar .pos{min-width:58px;text-align:center;color:var(--ink2);font-size:.9rem;font-weight:600}
.tq{width:100%;max-width:780px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 22px 18px;box-shadow:var(--sh)}
.tq .lab{margin-bottom:2px}
.tq .big{font-size:clamp(26px,4.8vw,44px)}
.tq .fr{font-size:clamp(16px,2.4vw,21px)}
.rules{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:680px}
.rules .rl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.rule{background:var(--card);border:1px dashed var(--line2);border-radius:999px;padding:6px 16px;font-weight:650;font-size:1.1rem}
.rule mark{background:var(--mark);border-radius:3px;padding:0 .05em}
.rules p{margin:0;color:var(--ink2)}
.down{color:var(--ink3);font-size:1.6rem;line-height:1}

/* dialogues */
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:8px 14px;border-radius:10px;min-height:42px;font-weight:650;color:var(--ink2);font-size:.95rem}
.seg button.on{background:var(--brand);color:#fff}
.dtools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 16px}
.dl{display:flex;flex-direction:column;gap:12px;padding-bottom:40px}
.bub{max-width:86%;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:10px 16px 12px;text-align:left;box-shadow:var(--sh)}
.bub.r{align-self:flex-end;border-radius:20px 20px 6px 20px;background:#F3F5F8}
.bub .who{font-size:.76rem;font-weight:750;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em}
.bub .s{font-size:clamp(20px,3vw,26px)}
.bub .fr{font-size:.98rem;margin-top:2px}
.bub.hid .s{color:var(--ink3)}
.bub.hid{border-style:dashed}
.bub.new{box-shadow:0 0 0 3px var(--brand);animation:pop .25s ease-out}
@keyframes pop{from{transform:translateY(10px);opacity:.2}to{transform:none;opacity:1}}
.dl.paso{padding-bottom:110px}

/* mode élève */
.mode-e{font-size:.78rem;font-weight:750;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:3px 10px;display:inline-block;margin-top:2px}
#ov{position:fixed;inset:0;background:rgba(20,25,30,.55);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
#ov.on{display:flex}
.kp{background:var(--card);border-radius:22px;padding:22px;width:min(360px,100%);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.kp h3{margin:0;font-size:1.15rem}
.kp .dots{display:flex;gap:14px;justify-content:center;margin:14px 0 18px}
.kp .dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink2)}
.kp .dots i.on{background:var(--ink);border-color:var(--ink)}
.kp .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kp .keys button{height:62px;border-radius:16px;background:var(--bg);font-size:1.5rem;font-weight:700;text-align:center}
.kp.err .dots{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.lchips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.lchips button{border:1px solid var(--line2);border-radius:999px;padding:8px 14px;background:#fff;font-size:.93rem;font-weight:600;text-align:center}
.lchips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.qr{background:#fff;padding:14px;border-radius:16px;border:1px solid var(--line);width:min(440px,100%);margin:6px auto 12px}
.qr svg{display:block;width:100%;height:auto}
.linkbox{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;word-break:break-all;background:var(--bg);border-radius:10px;padding:8px 10px;color:var(--ink2);max-height:5.5em;overflow:auto}

/* entraînement */
.ses-top{display:flex;align-items:center;gap:14px;margin:6px 0 14px}
.ses-prog{flex:1;height:10px;background:var(--line);border-radius:10px;overflow:hidden}
.ses-prog i{display:block;height:100%;background:var(--brand);border-radius:10px;transition:width .25s}
.ses-n{font-weight:700;color:var(--ink2);font-size:.95rem;min-width:56px;text-align:right}
.ex{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:4px 0 20px}
.tag{font-size:.78rem;font-weight:750;letter-spacing:.08em;text-transform:uppercase;color:var(--brand);background:var(--brand-soft);border-radius:999px;padding:4px 12px}
.q-pic{font-size:clamp(64px,11vw,92px)}
.q-es{font-size:clamp(26px,4.8vw,42px);font-weight:600;line-height:1.3}
.q-fr{font-size:clamp(24px,4.2vw,36px);font-weight:650;line-height:1.3}
.q-letter{font-size:clamp(90px,16vw,140px);font-weight:800;line-height:1}
.q-sub{color:var(--ink2);font-size:1rem}
.hint{color:var(--ink2);font-size:1rem;font-weight:650}
.say{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-weight:650;font-size:.95rem;color:var(--ink2)}
.opts{display:grid;gap:12px;width:100%;max-width:660px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 18px;min-height:66px;font-size:1.2rem;text-align:center;box-shadow:0 1px 0 var(--line)}
.opt .s{line-height:1.8}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.opt.dim{opacity:.45}
.veo-g{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:520px}
.veo-t{aspect-ratio:1.35;background:var(--card);border:2px solid var(--line);border-radius:18px;font-size:clamp(54px,9vw,76px);display:grid;place-items:center}
.veo-t.ok{border-color:var(--ok);background:var(--okbg)}
.veo-t.ko{border-color:var(--ko);background:var(--kobg)}
.veo-q{font-size:clamp(22px,3.8vw,32px);font-weight:600;line-height:1.4}
.slots{min-height:70px;width:100%;max-width:720px;border-bottom:2px solid var(--line2);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:8px 4px;font-size:1.3rem}
.slots .pu{font-weight:700;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:720px}
.chip{background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:8px 14px;font-size:1.3rem;min-height:54px;box-shadow:0 2px 0 var(--line2)}
.chip.used{visibility:hidden}
.chip.ed{font-size:1.1rem;min-height:46px;padding:6px 12px}
.fb{width:100%;max-width:660px;border-radius:16px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--okbg);border:1px solid #BFE3CB}
.fb.ko{background:var(--kobg);border:1px solid #F0D49A}
.fb-t{font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:8px}
.fb.ok .fb-t{color:var(--ok)}
.fb.ko .fb-t{color:var(--ko)}
.fb .s{font-size:1.2rem}
.cont{position:sticky;bottom:0;padding:12px 0 calc(12px + var(--sb));background:linear-gradient(rgba(246,244,240,0),var(--bg) 30%);width:100%;max-width:660px;display:flex;gap:10px}
.cont .btn{flex:1}
.reveal{width:100%;max-width:660px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px}

.combo{display:inline-block;background:#FFF3D6;color:#7A4B00;border-radius:999px;padding:2px 10px;font-weight:800;font-size:.9rem;margin-left:6px}
.fifty{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:12px;border:1px solid #E7D4F7;background:#F8F1FE;color:#5B2B8C;font-weight:700;font-size:.92rem}
@media (max-width:560px){.hero{grid-template-columns:120px 1fr;padding:12px}.wd{width:28px;height:28px}.alb-ll{width:96px}}

/* mémo */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}

<script>
'use strict';
/* ======================================================================
   ESPAÑOL 5e — outil d’accompagnement (un seul fichier, marche hors ligne)
   1. Contenu du cours       4. Progression (révisions espacées)
   2. Outils de langue       5. Écrans
   3. Données de l’appareil  6. Exercices
   ====================================================================== */
const VERSION = '1.4 — 28/11/2026';

/* ---------------------------------------------------------------- 1. COURS */
const UNIDADES = [
  {id:'u1', es:'Unidad 1 · ¿Empezamos?', fr:'On commence ?'},
  {id:'u2', es:'Unidad 2 · Me presento', fr:'Je me présente'},
];
// Syntaxe des phrases : {V:verbe} encadré · {Q:mot-question} souligné · {P:petit mot} entouré · ({O:yo}) facultatif
const W = (es, fr, img, o) => Object.assign({t:'w', es, fr, img:img || ''}, o || {});

 ]},
{id:'lista', u:'u1', icon:'📋', es:'Pasar lista', fr:'Faire l’appel',

{id:'espana', u:'u1', icon:'🌎', es:'España y Latinoamérica', fr:'L’Espagne et l’Amérique latine',
 items:[
  W('la copa del mundo', 'la coupe du monde', '🏆'),
  W('el sol', 'le soleil', '☀️'),
  W('un abanico', 'un éventail', 'svg:abanico'),
  W('la bandera', 'le drapeau', '🚩'),
  W('la pelota', 'le ballon', '⚽'),
  W('el toro', 'le taureau', '🐂'),
  W('la bailarina de flamenco', 'la danseuse de flamenco', '💃'),
  W('el mapa de Latinoamérica', 'la carte de l’Amérique latine', '🌎'),
  W('un cactus', 'un cactus', '🌵'),
  W('Chichén Itzá', 'des temples mayas, au Mexique', 'svg:piramide'),
 ]},
{id:'saludar', u:'u1', icon:'👋', es:'Saludar', fr:'Dire bonjour',
 intro:'Pour dire bonjour, ça dépend du <b>moment de la journée</b>.',
 items:[

  W('¡Buenos días!', 'Bonjour ! (le matin)', '🌅'),
  W('¡Buenas tardes!', 'Bonjour ! (l’après-midi)', '☀️'),

  W('por la noche', 'le soir, la nuit', '🌃'),
  D('Por la mañana', [
    ['Chico', '¡Buenos días!', 'Bonjour !'],

    ['Chico', '¡Bien! Gracias. ¿Y tú?', 'Bien ! Merci. Et toi ?'],

 ]},
{id:'despedirse', u:'u1', icon:'🚪', es:'Despedirse', fr:'Dire au revoir',
 intro:'<b>¡Buenas noches!</b> sert aussi à dire au revoir le soir.',

/* Découpe une phrase marquée en morceaux : {t, r (rôle), sp (espace avant), pre/post (ponctuation)} */
function parse(src) {
  const toks = []; let sp = false, m;
  const re = /\{([QVPO]):([^}]*)\}|(\s+)|([¿¡(]+)|([)?!.,;:…]+)|([^\s{}¿¡()?!.,;:…]+)/g;
  while ((m = re.exec(String(src || '')))) {
    if (m[3]) { sp = true; continue; }
    if (m[1]) toks.push({t:m[2], r:m[1], sp});
    else if (m[4]) toks.push({t:m[4], r:null, sp, pre:true});
    else if (m[5]) toks.push({t:m[5], r:null, sp, post:true});
    else toks.push({t:m[6], r:null, sp});
    sp = false;
  }
  return toks;
}
const isWord = k => !k.pre && !k.post;
const plain = es => parse(es).map((k, i) => (k.sp && i ? ' ' : '') + k.t).join('');
const speakText = es => plain(es).replace(/[()…]/g, ' ').replace(/\s+/g, ' ').trim();

function renderS(toks, o) {
  o = o || {};
  let out = '', chunk = '', wi = -1;
  const flush = () => { if (chunk) { out += (out ? ' ' : '') + `<span class="ch">${chunk}</span>`; chunk = ''; } };
  toks.forEach((k, i) => {
    if (k.sp && i > 0) flush();
    if (!isWord(k)) { chunk += `<span class="pu">${esc(k.t)}</span>`; return; }
    wi++;
    if (o.blank === i) { chunk += '<span class="blank" aria-label="mot manquant"></span>'; return; }
    let txt = esc(k.t), cls = 'w ' + (k.r ? k.r.toLowerCase() : 'n');
    const hidden = o.cases && !(o.rev && o.rev[i]);
    if (hidden) cls += ' hid';
    else if (o.hl && i in o.hl) { const n = o.hl[i]; if (n > 0) txt = esc(k.t.slice(0, n)) + `<mark>${esc(k.t.slice(n))}</mark>`; else cls += ' hl'; }
    const tap = o.tap ? ` data-act="tok" data-k="${o.tap}" data-i="${i}" role="button" tabindex="0"${hidden ? ' aria-label="mot caché"' : ''}` : '';
    let html = `<span class="${cls}"${tap}>${txt}</span>`;
    if (o.mam) html = `<span class="mw">${html}<small>${esc(o.mam[wi] || '') || '&nbsp;'}</small></span>`;
    chunk += html;
  });
  flush();
  return out;
}
const sHTML = (es, o) => `<span class="s">${renderS(parse(es), o)}</span>`;

function glossFor(tok) {
  const w = low(tok.t).replace(/[^a-záéíóúüñ\s-]/g, '').trim();
  const f = FORMS[w];
  if (f) return `<b>${esc(tok.t)}</b> = ${esc(f.fr)}<small>verbe <b>${f.inf}</b> (${esc(f.infFr)}) · avec <b>${PERS[f.p]}</b></small>`;
  if (LEX[w]) return `<b>${esc(tok.t)}</b> = ${esc(LEX[w])}`;
  return `<b>${esc(tok.t)}</b>`;
}

function mamWord(toks, i) {
  const k = toks[i], w = low(k.t).replace(/[^a-záéíóúüñ\s-]/g, '').trim();
  const words = toks.filter(isWord), j = words.indexOf(k), pv = words[j - 1], nx = words[j + 1];
  if (w === 'qué' && nx && low(nx.t) === 'tal') return 'comment';
  if (w === 'tal' && pv && low(pv.t) === 'qué') return '';
  if (w === 'mañana') return pv && low(pv.t) === 'la' ? 'matin' : 'demain';
  if (w === 'clase' && pv && pv.r === 'Q') return 'classe';
  if (w in MAM) return MAM[w];
  if (FORMS[w]) return FORMS[w].fr.split(',')[0];
  if (LEX[w] && !/prénom|nom de famille|nom du collège/.test(LEX[w])) return LEX[w].split(/ — |, | \(|=/)[0].trim();
  return '';
}
// mot à mot d’une phrase ; « custom » = ce que l’adulte a écrit (séparé par /), prioritaire mot par mot
function mamOf(toks, custom) {
  const c = Array.isArray(custom) ? custom : [];
  return toks.map((k, i) => [k, i]).filter(([k]) => isWord(k)).map(([k, i], j) => (c[j] && c[j].trim()) || mamWord(toks, i));
}
function commonPrefix(a, b) { let n = 0; while (n < a.length && n < b.length && a[n] === b[n]) n++; return n; }
// Ce qui change entre la question et la réponse (tú → yo)
function pairQA(qt, at) {
  const qHL = {}, aHL = {}, rules = [], used = new Set();
  qt.forEach((k, i) => {
    if (!isWord(k)) return;
    const lw = low(k.t), tgt = CORR[lw]; if (!tgt) return;
    const j = at.findIndex((m, jj) => !used.has(jj) && isWord(m) && low(m.t) === tgt);
    if (j < 0) return;
    used.add(j);
    const n = commonPrefix(lw, tgt), part = n >= 3 ? n : 0;
    qHL[i] = part; aHL[j] = part;
    rules.push({from:lw, to:tgt, n:part, verb:!!FORMS[lw]});
  });
  return {qHL, aHL, rules};
}
function autoRole(toks, i) {
  const k = toks[i], w = low(k.t), nx = toks[i + 1], pv = toks[i - 1];
  if (pv && pv.t.endsWith('(') && nx && nx.t.startsWith(')') && w === 'yo') return 'O';
  if (FORMS[w] || VX.has(w)) return 'V';
  if (QW.has(w)) return 'Q';
  if ((w === 'en' || w === 'de') && nx && QW.has(low(nx.t))) return 'Q';

  return null;
}
function initial(es) {
  const w = deacc(low(es)).replace(/^[¡¿]/, '').replace(/^(el|la|los|las|un|una)\s+/, '');
  return w.charAt(0) === 'n' && low(es).replace(/^(el|la|un|una)\s+/, '').charAt(0) === 'ñ' ? 'ñ' : w.charAt(0);
}

function lessons() {
  if (_lessons) return _lessons;
  const out = [];
  const add = (L, extra) => {
    const seen = {};
    const items = L.items.map(it => {
      const base = L.id + '/' + (it.t === 'qa' ? slug(it.q.es) : it.t === 'd' ? 'd-' + slug(it.titre) : it.t === 'l' ? 'l-' + it.l : slug(it.es));
      let id = it.id || base, k = 2;
      while (seen[id]) id = base + '-' + (k++);
      seen[id] = 1;
      return Object.assign({}, it, {id, _l:L.id});
    });
    out.push(Object.assign({}, L, extra, {items}));
  };
  const pl = persoLesson();
  LECCIONES.forEach(L => {
    if (pl && L.id === 'quien') add(pl, {perso:true});
    add(Object.assign({}, L, {items:L.items.concat(S.user.items.filter(x => x.l === L.id))}), {builtIn:true});
  });
  S.user.lessons.forEach(L => add(Object.assign({}, L, {items:S.user.items.filter(x => x.l === L.id)}), {mine:true}));

}

  if (co) {
    items.push(QA('¿{Q:Cuál} {V:es} {P:tu} color favorito?', 'Quelle est ta couleur préférée ?', `{P:Mi} color favorito {V:es} el ${co.es}.`, `Ma couleur préférée est le ${co.fr}.`));
    lines.push(['Yo', `{P:Mi} color favorito {V:es} el ${co.es}.`, `Ma couleur préférée est le ${co.fr}.`]);
  }
  const tp = p.tutor && p.profs[p.tutor] && cleanName(p.profs[p.tutor].n) ? p.profs[p.tutor] : null;
  if (tp) {
    const f = tp.t !== 'el señor', nm = cleanName(tp.n);
    items.push(QA(`¿{Q:Quién} {V:es} {P:tu} ${f ? 'tutora' : 'tutor'}?`, `Qui est ${f ? 'ta professeure principale' : 'ton professeur principal'} ?`,
      `{P:Mi} ${f ? 'tutora' : 'tutor'} {V:es} ${f ? 'la señora' : 'el señor'} ${nm}.`, `${f ? 'Ma professeure principale' : 'Mon professeur principal'} est ${f ? 'madame' : 'monsieur'} ${nm}.`));
  }
  profs.forEach(m => {
    const pr = p.profs[m.k], f = pr.t !== 'el señor', nm = cleanName(pr.n);
    const who = `${f ? 'la señora' : 'el señor'} ${nm}`, whoFr = `${f ? 'madame' : 'monsieur'} ${nm}`;
    items.push(QA(`¿{Q:Quién} {V:es} ${who}?`, `Qui est ${whoFr} ?`, `${cap(who)} {V:es} {P:mi} profe de ${m.es}.`, `${cap(whoFr)} est ${f ? 'ma' : 'mon'} prof ${m.de}.`));
    items.push(QA(`¿{Q:Cómo} {P:se} {V:llama} {P:tu} profe de ${m.es}?`, `Comment s’appelle ton prof ${m.de} ?`, `{P:Mi} profe de ${m.es} {P:se} {V:llama} ${who}.`, `Mon prof ${m.de} s’appelle ${whoFr}.`));
    const dias = DIAS_CLASE.filter(d => (pr.dias || []).includes(d));
    if (dias.length) {
      const many = dias.length > 1;
      const es = dias.map(d => 'el ' + d), fr = dias.map(d => 'le ' + JOURS[DIAS.indexOf(d)]);
      const join = (a, y) => a.length > 1 ? a.slice(0, -1).join(', ') + ' ' + y + ' ' + a[a.length - 1] : a[0];
      items.push(QA(`¿{Q:Qué} ${many ? 'días' : 'día'} {V:tienes} clase de ${m.es}?`, `${many ? 'Quels jours' : 'Quel jour'} as-tu cours ${m.de} ?`,
        `{V:Tengo} clase de ${m.es} ${join(es, 'y')}.`, `J’ai cours ${m.de} ${join(fr, 'et')}.`));
    }
  });
  lines.push(['Yo', '¡Hasta luego!', 'À plus tard !']);
  items.unshift(D('Mi presentación', lines));
  return {id:'perso', u:'u2', icon:'⭐', es:'Yo y mi colegio', fr:'Mes vraies réponses', items,
    intro:'Les phrases de l’élève, avec ses vrais professeurs. Elles restent seulement sur cette tablette.'};
}

function record(it, ok) {
  const before = S.prog[it.id] ? S.prog[it.id].b : 0;
  const t = today(), p = S.prog[it.id] || {b:0, d:t, n:0};
  const due = !S.prog[it.id] || p.d <= t;
  p.n = (p.n || 0) + 1;
  if (ok) { if (due) { p.b = Math.min(5, p.b + 1); p.d = addDays(t, INT[p.b]); } }
  else { p.b = 1; p.d = t; }
  S.prog[it.id] = p;

  if (ok) gainXP(10);

}

const Voz = {
  voice:null, ok:false,
  init() {
    if (!('speechSynthesis' in window)) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices() || [];
      const es = vs.filter(v => /^es([-_]|$)/i.test(v.lang));
      this.voice = es.find(v => /es[-_]ES/i.test(v.lang)) || es[0] || null;
      const was = this.ok; this.ok = !!this.voice;
      if (was !== this.ok) render();
    };
    pick();
    if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pick);
    let n = 0; const iv = setInterval(() => { pick(); if (this.ok || ++n > 12) clearInterval(iv); }, 300);
  },
  say(text) {
    if (!this.ok || !S.set.voz || !text) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.voice = this.voice; u.lang = this.voice.lang; u.rate = S.set.lento ? 0.62 : 0.9;
      speechSynthesis.speak(u);
    } catch (e) {}
  },
};

    if (step >= 2) {

        <p>${verb ? 'La question te parle à toi (<b>tú</b>). Dans ta réponse, tu parles de toi (<b>yo</b>).' : pr.rules.length ? 'Dans ta réponse, tu parles de toi.' : 'Ici, on parle de quelqu’un d’autre ou d’une chose : le verbe ne change pas.'}</p></div>`;
    }
    if (step === 3) body += `<div class="tq"><span class="lab">Réponse</span><div class="big"><span class="s">${renderS(at, opts('a', at, it.a.mam, {hl:cs ? null : pr.aHL}))}</span></div>${UI.fr && frOk ? `<div class="fr">${esc(it.a.fr)}</div>` : ''}</div>`;
    body += `<div class="gloss" id="gloss">${step === 1 || cs ? tip : ''}</div>`;
    if (step === 3 && it.note) body += `<div class="note">💡 ${esc(it.note)}</div>`;
    body += step === 1 ? `<button class="btn" data-act="step" data-k="${key}" data-n="2">Comment répondre ?</button>`
      : step === 2 ? `<button class="btn" data-act="step" data-k="${key}" data-n="3">Voir la réponse</button>`
      : `<button class="btn ghost" data-act="step" data-k="${key}" data-n="1">${I.redo} Recommencer</button>`;
  }
  if (vue === 'cases' && it.t !== 'w') body += `<div class="btn-row" style="justify-content:center"><button class="btn ghost sm" data-act="revall">Tout montrer</button><button class="btn ghost sm" data-act="hideall">Tout cacher</button></div>`;
  const vues = it.t === 'w' ? '' : `<div class="seg vues" role="group" aria-label="Affichage de la phrase">${[['phrase', 'Phrase'], ['cases', 'Cases'], ['mam', 'Mot à mot']].map(([v, t]) => `<button class="${vue === v ? 'on' : ''}" data-act="vue" data-v="${v}" aria-pressed="${vue === v}">${t}</button>`).join('')}</div>`;
  const legend = it.t !== 'w' && S.set.couleurs !== 'sans' ? `<div class="legend"><span><span class="w v">verbe</span></span><span><span class="w q">mot-question</span></span><span><span class="w p">petit mot</span></span></div>` : '';
  const tgl = frFirst ? `<button data-act="es" class="${UI.es ? 'on' : ''}" aria-pressed="${!!UI.es}" aria-label="Voir l’espagnol">ES</button>`
    : frOk ? `<button data-act="fr" class="${UI.fr ? 'on' : ''}" aria-pressed="${UI.fr}" aria-label="Traduction en français">FR</button>` : '';
  AFTER = () => { UI.nav = {prev:prev != null ? `f/${lid}/${prev}` : null, next:next != null ? `f/${lid}/${next}` : null}; };
  return bar(esc(L.es), `l/${lid}`) + vues + `<div class="fx">${body}${legend}</div>

    <button data-go="f/${lid}/${prev}" ${prev == null ? 'disabled' : ''} aria-label="Précédent">${I.back}</button>

    <button data-go="f/${lid}/${next}" ${next == null ? 'disabled' : ''} aria-label="Suivant">${I.next}</button>
  </nav>`;
}

/* --- Dialogues : lire, pas à pas, jouer un rôle --- */
function vDialogo(lid, idx) {
  const L = getLesson(lid), it = L && L.items[+idx];
  if (!it || it.t !== 'd' || !visible(L)) return bar('Introuvable', 'lecciones');
  const key = lid + ':' + idx;
  const st = UI.dlg[key] || (UI.dlg[key] = {mode:'todo', n:1, rol:null, open:{}, fr:{}});
  const who = [...new Set(it.lines.map(l => l.w))], N = it.lines.length;
  const frOk = !isEleve() || S.eleve.fr;
  if (N < 2) st.mode = 'todo';
  let h = bar(esc(it.titre), `l/${lid}`);
  h += `<div class="dtools">${N > 1 ? `<div class="seg" role="group" aria-label="Mode">
    <button class="${st.mode === 'todo' ? 'on' : ''}" data-act="dmode" data-k="${key}" data-m="todo">Tout lire</button>
    <button class="${st.mode === 'paso' ? 'on' : ''}" data-act="dmode" data-k="${key}" data-m="paso">Pas à pas</button>
    ${who.length > 1 ? `<button class="${st.mode === 'rol' ? 'on' : ''}" data-act="dmode" data-k="${key}" data-m="rol">Jouer un rôle</button>` : ''}
  </div>` : ''}
  ${frOk ? `<button class="btn ghost sm" data-act="fr">${UI.fr ? 'Cacher le français' : 'Voir le français'}</button>` : ''}</div>`;
  if (st.mode === 'rol') h += `<p class="muted" style="margin:0 0 12px">L’élève joue : ${who.map(w => `<button class="btn sm ${st.rol === w ? '' : 'ghost'}" data-act="drol" data-k="${key}" data-w="${esc(w)}">${esc(w)}</button>`).join(' ')}</p>`;
  if (st.mode === 'paso') h += `<p class="muted" style="margin:0 0 12px">Une réplique à la fois : touchez la dernière bulle ou le bouton en bas.</p>`;
  const lines = st.mode === 'paso' ? it.lines.slice(0, st.n) : it.lines;
  h += `<div class="dl${st.mode === 'paso' ? ' paso' : ''}">` + lines.map((l, i) => {

    const showFr = frOk && (UI.fr || st.fr[i]);
    return `<button class="bub${right ? ' r' : ''}${hidden ? ' hid' : ''}${isNew ? ' new' : ''}" data-act="dline" data-k="${key}" data-i="${i}">
      <div class="who">${esc(l.w)}${hidden ? ' · à toi !' : ''}</div>${hidden ? `<div class="s">${renderS(parse(l.es), {cases:true})}</div>${frOk ? `<div class="fr">Dis en espagnol : « ${esc(l.fr)} »</div>` : ''}<small class="muted">Touche la bulle pour vérifier.</small>` : sHTML(l.es)}
      ${!hidden && showFr ? `<div class="fr">${esc(l.fr)}</div>` : ''}</button>`;
  }).join('') + `</div>`;
  if (st.mode === 'paso') h += `<nav class="fbar">${st.n < N ? `<button class="btn" data-act="dnext" data-k="${key}">Réplique suivante · ${st.n} / ${N}</button>`
    : `<button class="btn ghost" data-act="dmode" data-k="${key}" data-m="paso">${I.redo} Recommencer</button>`}</nav>`;
  if (st.mode === 'rol' && !st.rol) h += `<p class="muted">Choisissez le rôle de l’élève : ses répliques seront cachées.</p>`;
  return h;
}

/* --- S’entraîner --- */
function spark() {
  const ks = Object.keys(S.hist).sort().slice(-30); if (ks.length < 2) return '';
  const vs = ks.map(k => S.hist[k]), mx = Math.max(1, ...vs), w = 260, hgt = 54;
  const pts = vs.map((v, i) => `${(i * (w - 8) / (vs.length - 1) + 4).toFixed(1)},${(hgt - 6 - v * (hgt - 12) / mx).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${hgt}" aria-label="Évolution des mots sus"><polyline points="${pts}" fill="none" stroke="#15803D" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

  const due = dueItems().length, kn = knownTotal(), tot = allTrain().length;

function buildMision() {

  if (due.length + fresh.length < 7) extra = prioritize(pool.filter(it => seen(it.id) && !isDue(it.id) && !due.includes(it))).slice(0, 7 - due.length - fresh.length);

}

  hideall() { ['s', 'q', 'a'].forEach(k => { delete UI.rev[UI.key + ':' + k]; }); render(); },

  apick(el) {

  pnext() { const P = UI.plan; if (!P) return; P.i++; if (P.i >= P.list.length) { UI.plan = null; go(`aprender/${P.lid}`); return; } startKind(P.list[P.i], P.lid); },
  aquit() { const lid = AV && AV.lid; AV = null; UI.plan = null; go(lid ? `aprender/${lid}` : 'entrenar'); },
  cflip() {
    const A = AV; if (!A || !A.queue.length) return;

  },
  cdir(el) { AV.dir = el.dataset.d; AV.flip = false; render(); },
  cknow(el) {
    const A = AV, ok = el.dataset.ok === '1', it = A.queue.shift();

  },
  wmode(el) { S.set.ecrire = el.dataset.m; save(); if (AV && AV.W && !AV.W.done) AV.W = newW(AV.W.it); render(); },
  // les lettres se posent librement ; le mot est vérifié quand il est complet ; on peut effacer
  wtile(el) {
    const W = AV.W; if (W.done || W.placed.length >= W.wp.letters.length) return;

  wback() { wCut(AV.W.placed.length - 1); },

  wdel(el) { wCut(+el.dataset.n); },

    wCheck();
  },
  wnext() { const A = AV; A.i++; A.W = A.i < A.deck.length ? newW(A.deck[A.i]) : null; render(); window.scrollTo(0, 0); },
  kbins(el) {

    inp.setRangeText(el.dataset.c, s, e, 'end'); AV.W.kb = inp.value; inp.focus();

  kbcheck() {
    const W = AV.W, inp = $('#kbin'); if (inp) W.kb = inp.value;
    if (!W.kb.trim()) { toast('Écris le mot d’abord.'); return; }
    const a = wNorm(W.kb), b = wNorm(W.wp.answer);

  },
  pair(el) {
    const A = AV; if (A.flash) return;
    const side = el.dataset.s, id = el.dataset.id, items = A.rounds[A.r];
    if (side === 'l') A.selL = A.selL === id ? null : id; else A.selR = A.selR === id ? null : id;
    if (A.selL && A.selR) {
      if (A.selL === A.selR) {
        const it = items.find(x => x.id === A.selL), ok = !A.wrong.has(it.id);
        A.matched.add(it.id); record(it, ok); if (ok) A.firstOk++; else A.res.push(it); snapshot(); save();
        A.selL = A.selR = null;
        if (A.matched.size === items.length) {
          render();
          setTimeout(() => { if (AV !== A) return; A.r++; if (A.r < A.rounds.length) Object.assign(A, newRound(A.rounds[A.r])); render(); }, 700);
          return;
        }
      } else {

        setTimeout(() => { if (AV !== A) return; A.flash = null; render(); }, 650);
        return;
      }
    }
    render();
  },
  pdir(el) { AV.dir = el.dataset.d; AV.selL = AV.selR = null; render(); },
  bcol() { S.set.blocs = S.set.blocs === false; save(); render(); },
  quit(el) { SES = null; UI.plan = null; go(el.dataset.back || 'entrenar'); },
  next() { SES.i++; SES.ans = null; render(); window.scrollTo(0, 0); },
  pick(el) { if (SES.ans) return; const ex = SES.steps[SES.i].ex, i = +el.dataset.i; answer(ex.opts[i].ok, i); },
  oadd(el) {
    const ex = SES.steps[SES.i].ex, ci = +el.dataset.i; if (SES.ans || ex.placed.includes(ci)) return;
    ex.placed.push(ci);
    if (ex.placed.length === ex.chips.length) answer(ex.placed.map(c => ex.chips[c].t).join(' ') === ex.target.join(' '));
    else render();
  },
  odel(el) { const ex = SES.steps[SES.i].ex; if (SES.ans) return; ex.placed.splice(+el.dataset.j, 1); render(); },
  reveal() { const ex = SES.steps[SES.i].ex; ex.open = true; render(); Voz.say(ex.say); },
  card(el) { const ex = SES.steps[SES.i].ex; ex.open = false; answer(el.dataset.ok === '1'); },
  again() { const errs = [...new Map(SES.errs.map(e => [e.id, e])).values()]; const k = SES.key; SES = SES.kind ? buildActSession(SES.kind, SES.lid, errs) : buildSession(k, errs); render(); },
  tset(el) { const k = el.dataset.k; S.set[k] = !S.set[k]; save(); render(); },
  sset(el) { S.set[el.dataset.k] = el.dataset.v; save(); render(); },
  etg(el) { const k = el.dataset.k; S.eleve[k] = !S.eleve[k]; save(); render(); },
  lchip(el) {
    const all = lessons().map(l => l.id), id = el.dataset.id;
    let sel = S.eleve.lecons ? S.eleve.lecons.filter(x => all.includes(x)) : all.slice();
    sel = sel.includes(id) ? sel.filter(x => x !== id) : sel.concat(id);
    S.eleve.lecons = sel.length === all.length ? null : sel; save(); render();
  },
  lall() { S.eleve.lecons = null; save(); render(); },
  lnone() { S.eleve.lecons = []; save(); render(); },
  eleveOn() {
    if (!S.eleve.k) { toast('Choisissez d’abord un code à 4 chiffres.'); const c = $('#ecode'); if (c) c.focus(); return; }
    if (S.eleve.lecons && !S.eleve.lecons.length) { toast('Choisissez au moins une leçon.'); return; }
    S.eleve.on = true; save(); invalidate(); go(''); toast('Mode élève activé');
  },
  lock() { if (Date.now() - (UI.longAt || 0) < 2000) return; if (!S.eleve.k) { leaveEleve(); return; } UI.pin = ''; showPad(); },
  pad(el) {
    if (UI.pin.length >= 4) return;
    UI.pin += el.dataset.n; showPad();
    if (UI.pin.length === 4) setTimeout(() => { if (hashCode(UI.pin) === S.eleve.k) leaveEleve(); else { UI.pin = ''; showPad(true); } }, 150);
  },
  padb() { UI.pin = UI.pin.slice(0, -1); showPad(); },
  padx() { UI.pin = ''; $('#ov').classList.remove('on'); },
  copy(el) {
    const t = el.dataset.t;
    const done = () => toast('Lien copié');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => window.prompt('Copiez ce lien :', t));
    else window.prompt('Copiez ce lien :', t);
  },
  pset(el) { S.perso[el.dataset.k] = el.dataset.v; save(); invalidate(); render(); },
  pday(el) { const pr = S.perso.profs[el.dataset.k] || (S.perso.profs[el.dataset.k] = {t:'la señora', n:'', dias:[]}); pr.dias = pr.dias || []; const d = el.dataset.d; pr.dias = pr.dias.includes(d) ? pr.dias.filter(x => x !== d) : pr.dias.concat(d); save(); invalidate(); render(); },
  ftype(el) { UI.form.t = el.dataset.t; render(); },
  cyc(el) {
    const f = UI.form, field = el.dataset.f, toks = parse(stripMarks(f[field])), i = +el.dataset.i;

  fsave() { saveForm(); },
  fdel(el) { if (!confirm('Supprimer cet élément ?')) return; S.user.items = S.user.items.filter(x => x.id !== el.dataset.id); save(); invalidate(); UI.form = null; toast('Supprimé'); go('mios'); },
  ldel(el) {

  },
  export() {

};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-go],[data-act]');
  if (!a || a.disabled) return;
  if (a.dataset.go !== undefined) { go(a.dataset.go); return; }
  const fn = ACT[a.dataset.act]; if (fn) { e.preventDefault(); fn(a, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-act="tok"]')) { ACT.tok(e.target); return; }
  if (e.key === 'Enter' && e.target.id === 'kbin') { e.preventDefault(); ACT.kbcheck(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.flip')) { e.preventDefault(); ACT.cflip(); return; }
  if (e.target.matches && e.target.matches('input,select,textarea')) return;
  if (UI.nav && current && current.fn === vFocus) {
    if (e.key === 'ArrowRight' && UI.nav.next) go(UI.nav.next);
    if (e.key === 'ArrowLeft' && UI.nav.prev) go(UI.nav.prev);
  }
});
// cadenas : un appui de 5 secondes fait sortir du mode élève (si le code est oublié)
let longT = null;
document.addEventListener('pointerdown', e => {
  if (!e.target.closest || !e.target.closest('[data-act="lock"]')) return;
  clearTimeout(longT); longT = setTimeout(() => { UI.longAt = Date.now(); leaveEleve(); }, 5000);
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, () => clearTimeout(longT)));
$('#ov').addEventListener('click', e => { if (e.target.id === 'ov') ACT.padx(); });
$('#cel').addEventListener('click', e => { if (e.target.id === 'cel') ACT.celok(); });
// les boutons d’accents ne font pas perdre le curseur du clavier
document.addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('[data-act="kbins"]')) e.preventDefault(); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'kbin' && AV && AV.W) { AV.W.kb = el.value; return; }
  if (el.dataset.ecode !== undefined) {
    el.value = el.value.replace(/\D/g, '').slice(0, 4);
    if (el.value.length === 4) { S.eleve.k = hashCode(el.value); save(); const ok = $('#codeok'); if (ok) ok.textContent = '✓ Code enregistré. Notez-le quelque part.'; }
    return;
  }
  if (el.dataset.pf !== undefined) { setPath(S.perso, el.dataset.pf, el.value); save(); invalidate(); if (el.tagName === 'SELECT') render(); return; }
  if (!UI.form) return;
  if (el.dataset.f !== undefined) {
    UI.form[el.dataset.f] = el.value; UI.form.dirty = true;
    if (el.dataset.f === 'l') { render(); return; }
    const c = $('#ch-' + el.dataset.f); if (c) c.innerHTML = chipsEd(el.dataset.f);
    const mf = MAMF[el.dataset.f] && $('#f-' + MAMF[el.dataset.f]); if (mf) mf.placeholder = autoMam(el.dataset.f);
  }
  if (el.dataset.nl !== undefined) { UI.form.nl[el.dataset.nl] = el.value; if (el.dataset.nl === 'u') render(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'fileIn' && el.files && el.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o || o.app !== 'espanol-5e' || !o.data) throw new Error('format');
        if (!confirm('Remplacer les données de cet appareil par cette sauvegarde ?')) return;
        localStorage.setItem(KEY, JSON.stringify(o.data)); S = load(); invalidate(); render(); toast('Sauvegarde restaurée');
      } catch (err) { toast('Ce fichier n’est pas une sauvegarde de l’appli.'); }
    };
    r.readAsText(el.files[0]); el.value = '';
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && current && current.fn === vHome) render(); });
window.addEventListener('hashchange', route);

/* ------------------------------------------- hors ligne (si servi en ligne) */
if (/^https?:/.test(location.protocol)) {
  const m = document.createElement('link'); m.rel = 'manifest'; m.href = 'manifest.webmanifest'; document.head.appendChild(m);
  if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
Voz.init();
(async () => {
  const m = location.hash.match(/^#e=([jz][A-Za-z0-9_-]+)/);
  if (m) {
    try { await importLink(m[1]); setTimeout(() => toast('C’est prêt ! Bon travail.'), 300); }
    catch (e) { setTimeout(() => toast('Ce lien ne fonctionne pas sur cet appareil.'), 300); }
    history.replaceState(null, '', location.pathname + location.search + '#/');
  }
  route();
})();
window.__esp = {
  llama, gainXP, G:() => G, buildMision, lvlOf, LV, OBJ, CULTURA, tirage,
  av:() => AV, actPool, writeParts, writable, buildAV, ACTS,
  // pour les contrôles : affiche un exercice donné, sans toucher à la progression
  testStep:(it, ex) => { SES = {key:'_t', steps:[{kind:'q', it, ex, retry:true}], i:0, ans:null, first:0, total:1, errs:[], practice:false};
    current = {fn:vSesion, args:['_t'], q:new URLSearchParams()}; render(); return app.innerText; },
  exVerbo, verbTarget, QR, payloadObj, packPayload, importLink, ses:() => SES, lessons, gen, parse, pairQA, persoLesson, buildSession, S:() => S, plain, initial, veoPool, VERBOS, CORR, LEX, FORMS};
